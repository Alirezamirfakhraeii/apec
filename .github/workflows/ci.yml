name: Laravel CI

on:
  push:
    branches:
      - main
      - refactor/admin-ui-standardization

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: _apec
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create CI environment
        run: |
          cat > .env << 'EOF'
          APP_NAME=APEC
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=_apec
          DB_USERNAME=root
          DB_PASSWORD=root

          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync

          MAIL_MAILER=array
          EOF

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear Laravel cache
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Check database configuration
        run: |
          php artisan tinker --execute="
          dump(config('database.default'));
          dump(config('database.connections.mysql.host'));
          dump(config('database.connections.mysql.database'));
          dump(config('database.connections.mysql.username'));
          dump(config('database.connections.mysql.password'));
          "

      - name: Run migrations
        run: php artisan migrate --force
