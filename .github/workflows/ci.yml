name: Laravel CI

on:
  push:
    branches:
      - main
      - refactor/admin-ui-standardization

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_DATABASE: _apec
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create CI environment
        run: |
          cp .env.example .env

          echo "APP_ENV=testing" >> .env

          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=_apec" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

          echo "CACHE_STORE=array" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear Laravel configuration
        run: |
          php artisan config:clear
          php artisan cache:clear

      - name: Check database configuration
        run: |
          php artisan tinker --execute="
          dump(config('database.default'));
          dump(config('database.connections.mysql.host'));
          dump(config('database.connections.mysql.database'));
          dump(config('database.connections.mysql.username'));
          "

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test
